name: TSF Droid Remote CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OpenDroid/TSF Droid pins the Gradle daemon to Java 21
      # (gradle/gradle-daemon-jvm.properties: toolchainVersion=21, jvmToolchain(21)).
      # JDK 17 cannot compile this project.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # NOTE: default packages list includes the obsolete 'tools' package,
      # which no longer exists in the SDK repository and fails sdkmanager.
      # Install only valid packages; licenses accepted here let AGP
      # auto-download any remaining platforms/build-tools it needs.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tsf-droid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

name: TSF Droid Emulator E2E

# End-to-end verification on a real Android emulator, in TWO SEPARATE JOBS
# (1.7.0-rc.1 restructure — audit of run 37770800170 proved the structural
# flaw: one job held both gates, so a rate-limited live provider painted the
# whole run red and the GREEN hermetic gate read as "BLOCKED" to the world):
#
#  1. hermetic-e2e  — REQUIRED RELEASE GATE. No live-provider dependency:
#     the launch smoke, the deterministic onboarding/dashboard/new-chat
#     journey, the accessibility targeting/scrape/readiness suites, the
#     keystore suites, and the FakeLLMProvider-driven agent-pipeline gates
#     (circuit breaker, vision confidence floor, background consent
#     boundary). Deterministic; cannot be starved by endpoint quota. Fast
#     (~20 min); this job alone decides whether the workflow is green.
#
#  2. live-e2e      — INFORMATIONAL. The keyless OpenCode Zen contract from
#     Android's TLS stack, plus the capability/UI/export/field suites that
#     drive real chats through the active provider. continue-on-error: it
#     NEVER blocks the release, but its verdict is classified with evidence
#     (PASS / RATE_LIMITED / FAIL / FAIL_TIMEOUT) in the job summary and
#     live-summary.txt — a rate-limited run reports RATE_LIMITED, never PASS,
#     and a genuine regression-shaped failure reports FAIL, never a hidden
#     green. Both attempts are preserved as separate artifacts.
#
#  3. e2e-verdict   — writes the combined summary block and re-fails the
#     workflow if the hermetic gate is anything but PASS.
#
# Runs in parallel: the release signal no longer waits hours for a flaky
# free tier. Pinned to ubuntu-24.04 — ubuntu-latest migrates to Ubuntu 26 on
# 2026-10-19 and a mid-release runner swap is exactly the kind of silent
# environment change this gate exists to exclude.

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'release/**' ]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - 'scripts/ci/**'
      - '.github/workflows/e2e-emulator.yml'

jobs:
  hermetic-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      gate: ${{ steps.result.outputs.gate }}
      tests: ${{ steps.result.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle daemon is pinned to Java 21 (gradle/gradle-daemon-jvm.properties).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ubuntu runners expose nested KVM but the runner user lacks permission;
      # without this the emulator falls back to software emulation and boots
      # in 12+ minutes (or never).
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Run HERMETIC E2E gate (required, deterministic)
        id: gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: '3072M'
          disk-size: '8G'
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/e2e_hermetic_gate.sh

      - name: Collect hermetic gate result
        id: result
        if: always()
        run: |
          if [ -f e2e-screens/hermetic-summary.txt ]; then
            cat e2e-screens/hermetic-summary.txt
            gate=$(sed -nE 's/^HERMETIC_GATE: //p' e2e-screens/hermetic-summary.txt | tail -1)
            tests=$(sed -nE 's/^HERMETIC_TESTS: //p' e2e-screens/hermetic-summary.txt | tail -1)
          else
            gate=ERROR
            tests="pass=0 total=0 fails=0 errors=0"
          fi
          echo "gate=${gate:-ERROR}" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          {
            echo "## Hermetic E2E (required release gate)"
            echo ""
            echo '```'
            echo "HERMETIC_GATE: ${gate:-ERROR}"
            echo "HERMETIC_TESTS: $tests"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture screen on failure
        if: failure()
        run: |
          if adb devices | grep -q "emulator.*device$"; then
            timeout 30 adb exec-out screencap -p > e2e-failure.png || true
            timeout 30 adb logcat -d > e2e-logcat.txt || true
          fi
          if [ -d app/build/outputs/androidTest-results ]; then
            mkdir -p e2e-results
            cp -r app/build/outputs/androidTest-results/* e2e-results/ || true
          fi

      - name: Generate QA diagnostic report
        if: always()
        run: |
          python3 scripts/generate_qa_report.py || true
          [ -f QA_REPORT.md ] && cat QA_REPORT.md || true

      - name: Upload hermetic E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsf-droid-hermetic-e2e
          path: |
            e2e-failure.png
            e2e-logcat.txt
            e2e-results/
            e2e-screens/
            QA_REPORT.md
          if-no-files-found: ignore
          retention-days: 14

  live-e2e:
    runs-on: ubuntu-24.04
    # INFORMATIONAL gate: a rate-limited or flaky free tier must never block a
    # release (the hermetic gate is the release truth), but every failure is
    # classified honestly in the summary — RATE_LIMITED only with measured
    # degradation evidence, FAIL when the shape looks like a real regression.
    continue-on-error: true
    timeout-minutes: 240
    outputs:
      gate: ${{ steps.result.outputs.gate }}
      tests: ${{ steps.result.outputs.tests }}
      failed_tests: ${{ steps.result.outputs.failed_tests }}
      rate_limit_evidence: ${{ steps.result.outputs.rate_limit_evidence }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Run LIVE-provider E2E suite (informational; honest classification)
        id: gate
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: '3072M'
          disk-size: '8G'
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/e2e_live_gate.sh

      - name: Collect live gate result
        id: result
        if: always()
        run: |
          if [ -f e2e-screens/live-summary.txt ]; then
            cat e2e-screens/live-summary.txt
            gate=$(sed -nE 's/^LIVE_GATE: //p' e2e-screens/live-summary.txt | tail -1)
            tests=$(sed -nE 's/^LIVE_TESTS: //p' e2e-screens/live-summary.txt | tail -1)
            failed=$(sed -nE 's/^FAILED_TESTS: //p' e2e-screens/live-summary.txt | tail -1)
            evidence=$(sed -nE 's/^RATE_LIMIT_EVIDENCE: //p' e2e-screens/live-summary.txt | tail -1)
          else
            gate=ERROR
            tests="pass=0 total=0 fails=0 errors=0"
            failed="unknown (no live-summary.txt produced)"
            evidence="none"
          fi
          echo "gate=${gate:-ERROR}" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "failed_tests=${failed:-none}" >> "$GITHUB_OUTPUT"
          echo "rate_limit_evidence=${evidence:-none}" >> "$GITHUB_OUTPUT"
          {
            echo "## Live-provider E2E (informational)"
            echo ""
            echo '```'
            echo "LIVE_GATE: ${gate:-ERROR}"
            echo "LIVE_TESTS: $tests"
            echo "FAILED_TESTS: ${failed:-none}"
            echo "RATE_LIMIT_EVIDENCE: ${evidence:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture screen on failure
        if: failure()
        run: |
          if adb devices | grep -q "emulator.*device$"; then
            timeout 30 adb exec-out screencap -p > e2e-failure.png || true
            timeout 30 adb logcat -d > e2e-logcat.txt || true
          fi
          if [ -d app/build/outputs/androidTest-results ]; then
            mkdir -p e2e-results
            cp -r app/build/outputs/androidTest-results/* e2e-results/ || true
          fi

      - name: Generate QA diagnostic report
        if: always()
        run: |
          python3 scripts/generate_qa_report.py || true
          [ -f QA_REPORT.md ] && cat QA_REPORT.md || true

      - name: Upload live E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsf-droid-live-e2e
          path: |
            e2e-failure.png
            e2e-logcat.txt
            e2e-results/
            e2e-screens/
            QA_REPORT.md
          if-no-files-found: ignore
          retention-days: 14

  e2e-verdict:
    needs: [hermetic-e2e, live-e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write combined E2E verdict
        run: |
          HERMETIC="${{ needs.hermetic-e2e.outputs.gate || 'ERROR' }}"
          HTESTS="${{ needs.hermetic-e2e.outputs.tests || 'pass=0 total=0 fails=0 errors=0' }}"
          LIVE="${{ needs.live-e2e.outputs.gate || 'SKIPPED' }}"
          LTESTS="${{ needs.live-e2e.outputs.tests || 'pass=0 total=0 fails=0 errors=0' }}"
          FAILED="${{ needs.live-e2e.outputs.failed_tests || 'none' }}"
          EVIDENCE="${{ needs.live-e2e.outputs.rate_limit_evidence || 'none' }}"
          {
            echo "## E2E verdict"
            echo ""
            echo '```'
            echo "HERMETIC_GATE: $HERMETIC"
            echo "HERMETIC_TESTS: $HTESTS"
            echo "LIVE_GATE: $LIVE"
            echo "LIVE_TESTS: $LTESTS"
            echo "FAILED_TESTS: $FAILED"
            echo "RATE_LIMIT_EVIDENCE: $EVIDENCE"
            echo '```'
            echo ""
            echo "HERMETIC_GATE: $HERMETIC — the release-blocking deterministic gate."
            echo "LIVE_GATE: $LIVE — informational; RATE_LIMITED requires measured provider degradation, FAIL means investigate."
          } >> "$GITHUB_STEP_SUMMARY"
          cat <<EOF
          HERMETIC_GATE: $HERMETIC
          LIVE_GATE: $LIVE
          FAILED_TESTS: $FAILED
          RATE_LIMIT_EVIDENCE: $EVIDENCE
          EOF
          if [ "$HERMETIC" != "PASS" ]; then
            echo "::error::HERMETIC GATE $HERMETIC — the required release gate did not pass."
            exit 1
          fi

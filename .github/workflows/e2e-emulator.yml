name: TSF Droid Emulator E2E

# End-to-end verification on a real Android emulator:
#  1. The keyless OpenCode Zen contract is exercised from Android's TLS stack
#     through the app's own provider (the verification no unit test can
#     substitute — the free-tier gate rejects bad client fingerprints at the
#     endpoint, which is exactly how v1.0.1 failed in the field).
#  2. MainActivity launch smoke through Hilt + splash + navigation.
# Screen captures are attached as artifacts so failures can be seen, not guessed.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - '.github/workflows/e2e-emulator.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle daemon is pinned to Java 21 (gradle/gradle-daemon-jvm.properties).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ubuntu-latest exposes nested KVM but the runner user lacks permission;
      # without this the emulator falls back to software emulation and boots
      # in 12+ minutes (or never).
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Run E2E suite on emulator (live OpenCode Zen endpoint)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: '3072M'
          disk-size: '8G'
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # The Zen E2E cases hit the real endpoint over the emulator NAT;
            # the launch smoke captures the first usable UI state; the UI
            # journey drives onboarding, every tab, Settings and TWO live
            # chats; the capability E2E gives the agent COMPLEX tasks (answer
            # a capability audit, write an HTML website file, fetch real data
            # from example.com in-app, generate a real PDF) and verifies the
            # artifacts on the device filesystem — the v1.0.5 field failures.
            # Tests run via `am instrument` (NOT connectedAndroidTest) so the
            # app stays installed while the screenshots are pulled — AGP's
            # connected task uninstalls both APKs before any later step runs.
            # NOTE: single line — the runner mangles backslash continuations.
            ./gradlew installDebug installDebugAndroidTest --no-daemon --stacktrace || exit 1; run_suite() { timeout 2700 adb shell am instrument -w -e class com.tsfdroid.ai.e2e.ZenFreeTierInstrumentedTest,com.tsfdroid.ai.e2e.AppLaunchInstrumentedTest,com.tsfdroid.ai.e2e.AppUiInteractionInstrumentedTest,com.tsfdroid.ai.e2e.AgentCapabilityE2EInstrumentedTest com.tsfdroid.ai.test/androidx.test.runner.AndroidJUnitRunner; }; out=$(run_suite); code=$?; echo "$out" | tail -12; if echo "$out" | grep -qE "FAILURES|INSTRUMENTATION_FAILED"; then echo "=== retry pass (free-tier latency flakes move between runs; a test that failed once must still pass on a clean retry) ==="; adb uninstall com.tsfdroid.ai >/dev/null 2>&1; adb install -r app/build/outputs/apk/debug/app-debug.apk >/dev/null 2>&1; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk >/dev/null 2>&1; out2=$(run_suite); code=$?; echo "$out2" | tail -12; out="$out2"; fi; echo "$out" | grep -qE "FAILURES|INSTRUMENTATION_FAILED" && code=1; mkdir -p e2e-screens; timeout 60 adb logcat -d > e2e-screens/instrument-logcat.txt 2>/dev/null || true; timeout 60 adb pull /sdcard/Android/data/com.tsfdroid.ai/files/e2e-screens/. e2e-screens/ 2>/dev/null; timeout 90 adb exec-out run-as com.tsfdroid.ai tar cf - files/e2e-screens 2>/dev/null | tar xf - -C e2e-screens --strip-components=2 || true; ls -la e2e-screens | head -40; adb uninstall com.tsfdroid.ai >/dev/null 2>&1; adb uninstall com.tsfdroid.ai.test >/dev/null 2>&1; exit $code

      - name: Capture screen on failure
        if: failure()
        run: |
          # Guard every adb call: after a failed script the emulator may be
          # gone, and adb blocks indefinitely instead of erroring.
          if adb devices | grep -q "emulator.*device$"; then
            timeout 30 adb exec-out screencap -p > e2e-failure.png || true
            timeout 30 adb logcat -d > e2e-logcat.txt || true
          fi
          if [ -d app/build/outputs/androidTest-results ]; then
            mkdir -p e2e-results
            cp -r app/build/outputs/androidTest-results/* e2e-results/ || true
          fi
      - name: Upload E2E artifacts (screens, logcat, results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsf-droid-e2e-artifacts
          path: |
            e2e-failure.png
            e2e-logcat.txt
            e2e-results/
            e2e-screens/
          if-no-files-found: ignore
          retention-days: 14
